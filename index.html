<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vở Ôn Toán</title>
<meta name="description" content="Vở ôn toán cho bé lớp 2 và lớp 4, ôn đúng lúc sắp quên.">
<meta name="theme-color" content="#4a2f91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vở Ôn Toán">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one centered "notebook page" column on ô-li grid paper; ink-purple for the child's work, teacher-red for marks. */
:root{
  --paper:#fbfaf6; --grid:#dfe3f1; --grid-strong:#c9cfe8;
  --ink:#4a2f91; --ink-soft:#ece6fa; --text:#25213a; --muted:#6b6784;
  --red:#d2382f; --red-soft:#fde6e3; --green:#1d8a55; --green-soft:#ddf3e7;
  --amber:#b36b00; --amber-soft:#fdf0d6; --card:#ffffff; --line:#e3e0ee;
  --f-display:"Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17152a; --grid:#232040; --grid-strong:#2c2850;
  --ink:#b9a6ff; --ink-soft:#2b2550; --text:#ece9f8; --muted:#a29dc0;
  --red:#ff7a6e; --red-soft:#3d1f22; --green:#5fd39a; --green-soft:#16362a;
  --amber:#f1b54a; --amber-soft:#3a2c12; --card:#1f1c36; --line:#332f55; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17152a; --grid:#232040; --grid-strong:#2c2850;
  --ink:#b9a6ff; --ink-soft:#2b2550; --text:#ece9f8; --muted:#a29dc0;
  --red:#ff7a6e; --red-soft:#3d1f22; --green:#5fd39a; --green-soft:#16362a;
  --amber:#f1b54a; --amber-soft:#3a2c12; --card:#1f1c36; --line:#332f55; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
  linear-gradient(var(--grid-strong) 1px,transparent 1px);
  background-size:12px 12px,12px 12px,48px 48px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:.2px;line-height:1;cursor:pointer;background:none;border:0;padding:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 18px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kid{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:10px}
.kid:hover{border-color:var(--ink)}
.kid .grade{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kid .name{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--ink);line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--ink-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px}
.stickers{font-size:28px;letter-spacing:4px;line-height:1.3;word-break:break-all}
/* session */
.progress{height:10px;border-radius:999px;background:var(--ink-soft);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;position:relative}
.qskill{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.3;color:var(--text)}
.qtext.long{font-family:var(--f-body);font-size:19px;font-weight:500;line-height:1.55}
.qtext .big{font-family:var(--f-display);font-size:32px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.answer{min-height:64px;border-bottom:3px dashed var(--ink);font-family:var(--f-display);font-size:38px;font-weight:800;color:var(--ink);display:flex;align-items:flex-end;padding:0 4px 2px;font-variant-numeric:tabular-nums}
.answer .ph{color:var(--muted);font-size:20px;font-weight:500;font-family:var(--f-body);padding-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pad button{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 0;font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--text);min-height:58px}
.pad button:active{background:var(--ink-soft)}
.pad .ok{background:var(--ink);color:var(--paper);border-color:var(--ink);font-size:20px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choices button{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 10px;font-family:var(--f-display);font-size:22px;font-weight:700;min-height:62px}
.choices button:hover{border-color:var(--ink)}
.hint{background:var(--amber-soft);color:var(--text);border-radius:12px;padding:10px 14px;font-size:15px}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.bad{background:var(--red-soft)}
.feedback.bad b{color:var(--red)}
.mark{position:absolute;top:10px;right:16px;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--green);transform:rotate(-8deg);pointer-events:none}
.mark.x{color:var(--red)}
.fig{display:flex;justify-content:center}
.fig svg{max-width:220px;width:100%;height:auto}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 4px;font-variant-numeric:tabular-nums}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px 2px}
.frac span:last-child{padding-top:2px}
.eq{font-size:30px;line-height:1.5}
/* parent */
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{width:70px;height:8px;border-radius:999px;background:var(--ink-soft);display:inline-block;vertical-align:middle;margin-right:6px;overflow:hidden}
.meter i{display:block;height:100%}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600}
.tabs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--ink-soft)}
textarea,input[type=text]{width:100%;font:inherit;font-size:14px;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);color:var(--text)}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.note{font-size:14px;color:var(--muted)}
.big-num{font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--ink);line-height:1}
@media (max-width:480px){.qtext{font-size:23px}.answer{font-size:32px}h1{font-size:26px}}
.pad button,.choices button,.btn,.kid{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.log td,.log th{font-size:13px;padding:7px 10px}
.log .ok{color:var(--green);font-weight:700}.log .no{color:var(--red);font-weight:700}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" type="button">Vở Ôn Toán<small>Ôn đúng lúc sắp quên</small></button>
    <div class="row">
      <button class="btn small ghost" id="parentBtn" type="button">Trang phụ huynh</button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
/* ================= utilities ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const fmt=n=>Number(n).toLocaleString('vi-VN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const simp=(a,b)=>{const g=gcd(a,b);a/=g;b/=g;return b===1?String(a):`${a}/${b}`};
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const dayLabel=n=>{const t=today();if(n<=t)return'Hôm nay';if(n===t+1)return'Ngày mai';const d=new Date(n*86400000);return `${d.getUTCDate()}/${d.getUTCMonth()+1}`};

/* ================= FSRS-4.5 (default weights), scheduled per skill ================= */
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const F=19/81, C=-0.5, RET=0.9;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retr=(t,s)=>Math.pow(1+F*t/s,C);
const initD=g=>clamp(W[4]-(g-3)*W[5],1,10);
function fsrsReview(card,g,now){ // g: 1 Again, 2 Hard, 3 Good, 4 Easy
  let s,d;
  if(!card||!card.s){ s=W[g-1]; d=initD(g); }
  else{
    const t=Math.max(0,(now-card.last)/86400000);
    const r=retr(t,card.s);
    d=clamp(W[7]*initD(3)+(1-W[7])*(card.d-W[6]*(g-3)),1,10);
    if(g===1){ s=Math.min(card.s, W[11]*Math.pow(card.d,-W[12])*(Math.pow(card.s+1,W[13])-1)*Math.exp((1-r)*W[14])); }
    else{ s=card.s*(1+Math.exp(W[8])*(11-card.d)*Math.pow(card.s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1)); }
  }
  const ivl=clamp(Math.round(s/F*(Math.pow(RET,1/C)-1)),1,180);
  return {s,d,last:now,due:today()+ivl,reps:(card?.reps||0)+1,lapses:(card?.lapses||0)+(g===1&&card?.s?1:0),ivl};
}
const cardR=c=>c&&c.s?retr(Math.max(0,(Date.now()-c.last)/86400000),c.s):null;

/* ================= skills & problem generators ================= */
const WORDS_G2=[
 ()=>{const a=rnd(18,45),b=rnd(5,19);return{q:`Lớp 2A có ${a} bạn nữ. Số bạn nam nhiều hơn số bạn nữ ${b} bạn. Hỏi lớp 2A có bao nhiêu bạn nam?`,ans:a+b,hint:'"Nhiều hơn" thì làm phép cộng.',ex:`${a} + ${b} = ${a+b}`}},
 ()=>{const a=rnd(40,90),b=rnd(8,35);return{q:`Bao gạo nặng ${a} kg. Bao ngô nhẹ hơn bao gạo ${b} kg. Hỏi bao ngô nặng bao nhiêu ki-lô-gam?`,ans:a-b,hint:'"Nhẹ hơn" thì làm phép trừ.',ex:`${a} − ${b} = ${a-b}`}},
 ()=>{const a=rnd(35,95),b=rnd(9,30);return{q:`Cây cam có ${a} quả. Bà hái ${b} quả để biếu hàng xóm. Hỏi trên cây còn lại bao nhiêu quả cam?`,ans:a-b,hint:'Hái đi thì số quả ít đi.',ex:`${a} − ${b} = ${a-b}`}},
 ()=>{const a=rnd(25,60),b=rnd(15,39);return{q:`Mai gấp được ${a} con hạc giấy, Lan gấp được ${b} con. Hỏi cả hai bạn gấp được bao nhiêu con hạc?`,ans:a+b,hint:'"Cả hai" thì gộp lại.',ex:`${a} + ${b} = ${a+b}`}},
];
const FRUITS=[['🍎','🍌'],['🐱','🐶'],['⭐','🌙'],['🍓','🍇'],['🚗','🚲']];

const SKILLS={
 g2:[
  {id:'g2_cong',name:'Cộng có nhớ (phạm vi 100)',slow:12,gen(){let a,b;do{a=rnd(12,79);b=rnd(6,49)}while((a%10)+(b%10)<10||a+b>100);return{q:`<span class="big">${a} + ${b} = ?</span>`,ans:a+b,hint:`Cộng hàng đơn vị trước: ${a%10} + ${b%10} = ${a%10+b%10}, viết ${(a+b)%10} nhớ 1.`,ex:`${a} + ${b} = ${a+b}`}}},
  {id:'g2_tru',name:'Trừ có nhớ (phạm vi 100)',slow:14,gen(){let a,b;do{a=rnd(31,99);b=rnd(7,a-10)}while((a%10)>=(b%10));return{q:`<span class="big">${a} − ${b} = ?</span>`,ans:a-b,hint:`${a%10} không trừ được ${b%10}, lấy ${10+a%10} − ${b%10} rồi nhớ 1 sang hàng chục.`,ex:`${a} − ${b} = ${a-b}`}}},
  {id:'g2_sosanh',name:'So sánh số có ba chữ số',slow:8,gen(){const a=rnd(100,999);let b=Math.random()<.15?a:(Math.random()<.5?a+rnd(-9,9):Math.floor(a/100)*100+rnd(0,99));b=clamp(b,100,999);const s=a>b?'>':a<b?'<':'=';return{q:`<span class="big">${a} &nbsp;?&nbsp; ${b}</span>`,choices:['<','=','>'],ans:s,hint:'So sánh hàng trăm trước, bằng nhau thì so hàng chục, rồi hàng đơn vị.',ex:`${a} ${s} ${b}`}}},
  {id:'g2_cautao',name:'Cấu tạo số (trăm, chục, đơn vị)',slow:10,gen(){const h=rnd(1,9),t=rnd(0,9),u=rnd(0,9),n=h*100+t*10+u;if(Math.random()<.5)return{q:`Số gồm <span class="big">${h}</span> trăm, <span class="big">${t}</span> chục và <span class="big">${u}</span> đơn vị là số nào?`,long:1,ans:n,hint:'Viết lần lượt chữ số hàng trăm, hàng chục, hàng đơn vị.',ex:`${h} trăm ${t} chục ${u} đơn vị = ${n}`};return{q:`<span class="big">${n} = ${h*100} + ? + ${u}</span>`,ans:t*10,hint:`Chữ số hàng chục là ${t}, vậy là ${t} chục.`,ex:`${n} = ${h*100} + ${t*10} + ${u}`}}},
  {id:'g2_nhan',name:'Bảng nhân 2 và 5',slow:6,gen(){const a=pick([2,5]),b=rnd(1,10);return Math.random()<.5?{q:`<span class="big">${a} × ${b} = ?</span>`,ans:a*b,hint:`${a} được lấy ${b} lần: cộng ${a} liên tiếp ${b} lần.`,ex:`${a} × ${b} = ${a*b}`}:{q:`<span class="big">${b} × ${a} = ?</span>`,ans:a*b,hint:`Đổi chỗ thừa số: ${b} × ${a} = ${a} × ${b}.`,ex:`${b} × ${a} = ${a*b}`}}},
  {id:'g2_chia',name:'Bảng chia 2 và 5',slow:8,gen(){const a=pick([2,5]),b=rnd(1,10);return{q:`<span class="big">${a*b} : ${a} = ?</span>`,ans:b,hint:`Nhẩm: ${a} nhân mấy bằng ${a*b}?`,ex:`${a*b} : ${a} = ${b} vì ${a} × ${b} = ${a*b}`}}},
  {id:'g2_timso',name:'Tìm số còn thiếu',slow:14,gen(){const a=rnd(11,60),b=rnd(10,39),t=pick([0,1,2]);if(t===0)return{q:`<span class="big">? + ${b} = ${a+b}</span>`,ans:a,hint:'Số hạng chưa biết = tổng trừ số hạng đã biết.',ex:`${a+b} − ${b} = ${a}`};if(t===1)return{q:`<span class="big">${a+b} − ? = ${a}</span>`,ans:b,hint:'Số trừ = số bị trừ trừ hiệu.',ex:`${a+b} − ${a} = ${b}`};return{q:`<span class="big">? − ${b} = ${a}</span>`,ans:a+b,hint:'Số bị trừ = hiệu cộng số trừ.',ex:`${a} + ${b} = ${a+b}`}}},
  {id:'g2_dayso',name:'Quy luật dãy số',tag:'Tư duy',slow:15,gen(){const d=pick([2,3,5,10,4]),up=Math.random()<.7;let s=up?rnd(1,40):rnd(60,99);const seq=[0,1,2,3,4].map(i=>up?s+i*d:s-i*d);const hole=pick([2,3,4]);const shown=seq.map((x,i)=>i===hole?'?':x).join(', ');return{q:`Điền số còn thiếu:<br><span class="big">${shown}</span>`,long:1,ans:seq[hole],hint:`Xem hai số liền nhau hơn kém nhau bao nhiêu.`,ex:`Mỗi số ${up?'hơn':'kém'} số trước ${d}: ${seq.join(', ')}`}}},
  {id:'g2_canbang',name:'Đoán giá trị con vật, đồ vật',tag:'Tư duy',slow:25,gen(){const [A,B]=pick(FRUITS),a=rnd(2,9),b=rnd(1,9);return{q:`<div class="eq">${A} + ${A} = ${2*a}<br>${A} + ${B} = ${a+b}<br>${B} = ?</div>`,long:1,ans:b,hint:`Từ dòng đầu, tìm ${A} trước: hai ${A} bằng ${2*a}.`,ex:`${A} = ${a}, nên ${B} = ${a+b} − ${a} = ${b}`}}},
  {id:'g2_1000',name:'Cộng, trừ trong phạm vi 1000',slow:22,gen(){if(Math.random()<.5){let a,b;do{a=rnd(105,750);b=rnd(102,499)}while(a+b>999);return{q:`<span class="big">${a} + ${b} = ?</span>`,ans:a+b,hint:'Đặt tính thẳng cột, cộng từ phải sang trái.',ex:`${a} + ${b} = ${a+b}`}}const a=rnd(300,999),b=rnd(101,a-50);return{q:`<span class="big">${a} − ${b} = ?</span>`,ans:a-b,hint:'Đặt tính thẳng cột, trừ từ phải sang trái, nhớ khi cần.',ex:`${a} − ${b} = ${a-b}`}}},

function genQ(skill){let o=skill.gen();if(skill.post)o=skill.post(o);o.ans=String(o.ans);return o}
function roman(n){const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m){while(n>=v){s+=r;n-=v}}return s}
function clockSVG(h,m){const cx=100,cy=100;let ticks='';for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;ticks+=`<text x="${cx+74*Math.cos(a)}" y="${cy+74*Math.sin(a)+7}" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text)" font-family="Baloo 2, sans-serif">${i}</text>`}
  const ha=((h%12)*30+m*0.5-90)*Math.PI/180, ma=(m*6-90)*Math.PI/180;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Đồng hồ"><circle cx="100" cy="100" r="94" fill="var(--card)" stroke="var(--ink)" stroke-width="5"/>${ticks}<line x1="100" y1="100" x2="${cx+45*Math.cos(ha)}" y2="${cy+45*Math.sin(ha)}" stroke="var(--text)" stroke-width="8" stroke-linecap="round"/><line x1="100" y1="100" x2="${cx+66*Math.cos(ma)}" y2="${cy+66*Math.sin(ma)}" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="var(--ink)"/></svg>`}
function angleSVG(deg){const r=deg*Math.PI/180,rot=rnd(-20,20)*Math.PI/180,ox=110,oy=120,L=90;const p1=[ox+L*Math.cos(rot),oy-L*Math.sin(rot)],p2=[ox+L*Math.cos(rot+r),oy-L*Math.sin(rot+r)];
  const a1=[ox+26*Math.cos(rot),oy-26*Math.sin(rot)],a2=[ox+26*Math.cos(rot+r),oy-26*Math.sin(rot+r)];
  const arc=deg===90?`<path d="M${ox+18*Math.cos(rot)} ${oy-18*Math.sin(rot)} L${ox+18*Math.cos(rot)+18*Math.cos(rot+r)} ${oy-18*Math.sin(rot)-18*Math.sin(rot+r)} L${ox+18*Math.cos(rot+r)} ${oy-18*Math.sin(rot+r)}" fill="none" stroke="var(--red)" stroke-width="3"/>`:`<path d="M${a1[0]} ${a1[1]} A26 26 0 0 0 ${a2[0]} ${a2[1]}" fill="none" stroke="var(--red)" stroke-width="3"/>`;
  return `<svg viewBox="0 0 220 220" role="img" aria-label="Một góc"><line x1="${ox}" y1="${oy}" x2="${p1[0]}" y2="${p1[1]}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><line x1="${ox}" y1="${oy}" x2="${p2[0]}" y2="${p2[1]}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>${arc}<circle cx="${ox}" cy="${oy}" r="5" fill="var(--text)"/></svg>`}

/* ================= state ================= */
const KEY='vo-on-toan-v1';
const STICKERS=['🦋','🌟','🐱','🌈','🐼','🍓','🚀','🦄','🐢','🌻','🐳','🎈','🐰','🍉','🦊','🐧','🌸','🐝','🍦','🐬'];
function freshState(){return{profiles:[
  {id:'k2',name:'Bé lớp 2',grade:'g2',skills:{},streak:0,lastDay:null,stickers:[],sessions:0},
  {id:'k4',name:'Bé lớp 4',grade:'g4',skills:{},streak:0,lastDay:null,stickers:[],sessions:0}]}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||freshState()}catch(e){state=freshState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}DB.putKV('state',state)}

/* ================= lưu trữ bền & nhật ký thao tác (IndexedDB) =================
   - 'kv'.state: bản sao của state (phòng khi localStorage bị trình duyệt dọn)
   - 'events': mỗi thao tác của bé là một dòng (bắt đầu lượt, từng câu trả lời, kết thúc, dừng giữa chừng) */
const DB={_db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no-idb'));
    const r=indexedDB.open('vo-on-toan',1);
    r.onupgradeneeded=()=>{const d=r.result;const ev=d.createObjectStore('events',{keyPath:'id',autoIncrement:true});ev.createIndex('pid','pid');d.createObjectStore('kv')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const req=fn(t.objectStore(store));t.oncomplete=()=>res(req&&'result' in req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  putKV(k,v){return this.run('kv','readwrite',s=>s.put(JSON.parse(JSON.stringify(v)),k)).catch(()=>{})},
  getKV(k){return this.run('kv','readonly',s=>s.get(k)).catch(()=>undefined)},
  add(ev){return this.run('events','readwrite',s=>s.add(ev)).catch(()=>{})},
  all(){return this.run('events','readonly',s=>s.getAll()).catch(()=>[])},
  byPid(pid){return this.run('events','readonly',s=>s.index('pid').getAll(pid)).catch(()=>[])},
  replaceAll(evs){return this.run('events','readwrite',s=>{s.clear();evs.forEach(e=>{const x={...e};delete x.id;s.add(x)})}).catch(()=>{})},
  delPid(pid){return this.run('events','readwrite',s=>{const r=s.index('pid').openKeyCursor(IDBKeyRange.only(pid));r.onsuccess=()=>{const c=r.result;if(c){s.delete(c.primaryKey);c.continue()}}}).catch(()=>{})}
};
const plain=h=>String(h).replace(/<span class="frac"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g,' $1/$2 ').replace(/<br\s*\/?>/g,' ').replace(/<div class="fig">[\s\S]*?<\/svg><\/div>/g,' [hình] ').replace(/<div class="note"[\s\S]*?<\/div>/g,'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
function logEv(ev){DB.add({ts:Date.now(),day:today(),...ev})}
(async()=>{ // nếu localStorage trống mà IndexedDB còn bản sao thì khôi phục
  let had=false;try{had=!!localStorage.getItem(KEY)}catch(e){}
  if(!had){const s=await DB.getKV('state');if(s&&s.profiles){state=s;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};render()}}
  else DB.putKV('state',state);
  try{navigator.storage?.persist?.()}catch(e){}
})();
const prof=id=>state.profiles.find(p=>p.id===id);
const skillsOf=p=>SKILLS[p.grade];

function skillStatus(c){if(!c||!c.s)return{k:'new',label:'Chưa học',cls:''};if(c.due<=today())return{k:'due',label:'Đến hạn ôn',cls:'red'};const r=cardR(c);if(r<0.93)return{k:'soon',label:'Sắp đến hạn',cls:'amber'};return{k:'good',label:'Nhớ tốt',cls:'green'}}
function dueCount(p){return skillsOf(p).filter(s=>{const c=p.skills[s.id];return c&&c.s&&c.due<=today()}).length}
function newCount(p){return skillsOf(p).filter(s=>!p.skills[s.id]?.s).length}

/* ================= session building ================= */
function buildSession(p,onlySkill){
  const list=skillsOf(p);let chosen=[];
  if(onlySkill){chosen=[list.find(s=>s.id===onlySkill)]}
  else{
    const due=list.filter(s=>{const c=p.skills[s.id];return c&&c.s&&c.due<=today()}).sort((a,b)=>cardR(p.skills[a.id])-cardR(p.skills[b.id])).slice(0,4);
    const fresh=list.filter(s=>!p.skills[s.id]?.s).slice(0,due.length>=3?1:2);
    chosen=[...due,...fresh];
    if(chosen.length<3){const extra=list.filter(s=>p.skills[s.id]?.s&&!chosen.includes(s)).sort((a,b)=>cardR(p.skills[a.id])-cardR(p.skills[b.id]));chosen.push(...extra.slice(0,3-chosen.length))}
  }
  const per=onlySkill?5:2;const qs=[];
  chosen.forEach(s=>{for(let i=0;i<per;i++)qs.push({skill:s,...genQ(s)})});
  // interleave so the same skill is not back to back when possible
  let order=shuffle(qs);for(let i=1;i<order.length;i++){if(order[i].skill===order[i-1].skill){const j=order.findIndex((q,k)=>k>i&&q.skill!==order[i].skill);if(j>0)[order[i],order[j]]=[order[j],order[i]]}}
  const sid=Date.now();logEv({t:'start',pid:p.id,sid,mode:onlySkill?'practice':'daily',skills:chosen.map(s=>s.id),n:order.length});
  return{sid,pid:p.id,qs:order,i:0,results:{},retry:[],correct:0,total:order.length,input:'',hintUsed:false,start:Date.now(),phase:'ask',chosen:chosen.map(s=>s.id)};
}

function curQ(){return sess.qs[sess.i]}
function renderSession(){
  const q=curQ();const p=prof(sess.pid);
  const pct=Math.round(sess.i/sess.qs.length*100);
  const isChoice=!!q.choices;
  const answered=sess.phase!=='ask';
  app.innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><span class="note">${esc(p.name)} · Câu ${sess.i+1}/${sess.qs.length}</span><button class="btn small ghost" id="quit" type="button">Dừng</button></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qcard">
      ${sess.phase==='right'?'<div class="mark">Đ</div>':''}${sess.phase==='wrong'?'<div class="mark x">S</div>':''}
      <span class="qskill">${esc(q.skill.name)}${q.skill.tag?' · '+q.skill.tag:''}${q.retry?' · Làm lại':''}</span>
      <div class="qtext ${q.long?'long':''}">${q.q}</div>
      ${sess.hintUsed&&sess.phase==='ask'?`<div class="hint"><b>Gợi ý:</b> ${q.hint}</div>`:''}
      ${isChoice?`<div class="choices">${q.choices.map(c=>`<button type="button" data-c="${esc(c)}" ${answered?'disabled':''}>${esc(c)}</button>`).join('')}</div>`
        :`<div class="answer" aria-live="polite">${sess.input?esc(sess.input):'<span class="ph">Bấm số để trả lời</span>'}</div>`}
      ${sess.phase==='wrong'?`<div class="feedback bad"><div>Chưa đúng rồi. Đáp án là <b>${esc(q.ans)}</b></div><div class="note">${q.ex}</div></div>`:''}
      ${!isChoice&&sess.phase==='ask'?padHTML(q.skill.frac):''}
      <div class="row" style="justify-content:space-between">
        ${sess.phase==='ask'?`<button class="btn small" id="hintBtn" type="button" ${sess.hintUsed?'disabled':''}>Xem gợi ý</button>`:'<span></span>'}
        ${sess.phase==='wrong'?'<button class="btn primary" id="nextBtn" type="button">Câu tiếp theo</button>':''}
      </div>
    </div>
  </div>`;
  document.getElementById('quit').onclick=()=>{logEv({t:'quit',pid:sess.pid,sid:sess.sid,at:sess.i,of:sess.qs.length});sess=null;go({name:'kid',pid:p.id})};
  const hb=document.getElementById('hintBtn');if(hb)hb.onclick=()=>{sess.hintUsed=true;renderSession()};
  const nb=document.getElementById('nextBtn');if(nb){nb.onclick=next;nb.focus()}
  app.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>submit(b.dataset.c));
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>key(b.dataset.k));
}
function padHTML(frac){const ks=['7','8','9','⌫','4','5','6',frac?'/':'','1','2','3','','0'];return `<div class="pad">${ks.map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}" aria-label="${k==='⌫'?'Xóa':k}">${k}</button>`).join('')}<button type="button" class="ok" data-k="ok" style="grid-column:span 3">Xong</button></div>`}
function key(k){if(!sess||sess.phase!=='ask')return;
  if(k==='ok'){if(sess.input)submit(sess.input);return}
  if(k==='⌫')sess.input=sess.input.slice(0,-1);
  else if(sess.input.length<12){if(k==='/'&&(sess.input.includes('/')||!sess.input))return;sess.input+=k}
  renderSession()}
document.addEventListener('keydown',e=>{if(view.name!=='session'||!sess)return;
  if(sess.phase==='wrong'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();return}
  const q=curQ();if(q.choices)return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('ok');else if(e.key==='/'&&q.skill.frac)key('/')});

function check(q,input){
  const norm=s=>String(s).replace(/[.\s]/g,'');
  if(q.choices)return input===q.ans;
  if(q.exact)return norm(input)===norm(q.ans);
  return norm(input)===norm(q.ans);
}
function submit(input){
  const q=curQ();const ok=check(q,input);const secs=(Date.now()-sess.start)/1000;
  let g; if(!ok)g=1; else if(sess.hintUsed)g=2; else if(secs>q.skill.slow)g=3; else g=4;
  logEv({t:'answer',pid:sess.pid,sid:sess.sid,skill:q.skill.id,q:plain(q.q),ans:q.ans,input:String(input),ok,secs:Math.round(secs*10)/10,hint:sess.hintUsed,g,retry:!!q.retry});
  if(!q.retry){const id=q.skill.id;sess.results[id]=Math.min(sess.results[id]??4,g);if(ok)sess.correct++}
  if(ok){sess.phase='right';renderSession();setTimeout(next,700)}
  else{sess.phase='wrong';if(!q.retry)sess.retry.push(q.skill);renderSession()}
}
function next(){if(!sess)return;
  sess.i++;
  if(sess.i>=sess.qs.length&&sess.retry.length){ // one fresh retry per missed skill, does not change the schedule
    const s=sess.retry.shift();sess.qs.push({skill:s,...genQ(s),retry:true})}
  if(sess.i>=sess.qs.length){finish();return}
  sess.input='';sess.hintUsed=false;sess.phase='ask';sess.start=Date.now();renderSession()}
function finish(){
  const p=prof(sess.pid);const now=Date.now();const changes=[];
  for(const [id,g] of Object.entries(sess.results)){const before=p.skills[id];const c=fsrsReview(before,g,now);p.skills[id]=c;changes.push({id,g,ivl:c.ivl})}
  const t=today();if(p.lastDay!==t){p.streak=(p.lastDay===t-1)?p.streak+1:1;p.lastDay=t}
  const st=STICKERS[(p.sessions)%STICKERS.length];p.stickers.push(st);p.sessions++;
  save();
  logEv({t:'finish',pid:p.id,sid:sess.sid,correct:sess.correct,total:sess.total,secs:Math.round((now-sess.sid)/1000),sticker:st,changes});
  view={name:'done',pid:p.id,changes,correct:sess.correct,total:sess.total,sticker:st};sess=null;render();window.scrollTo(0,0);
}

    <div class="panel stack" id="logPanel">
      <h2>Nhật ký học</h2>
      <p class="note" style="margin:0">Đang tải...</p>
    </div>
    <div class="panel stack" id="installPanel"></div>
    <div class="panel stack">
      <h2>Sao lưu dữ liệu</h2>
      <p class="note" style="margin:0">Tiến độ và nhật ký lưu ngay trên máy này, không cần mạng. Nên tải file sao lưu định kỳ, hoặc khi muốn chuyển sang máy khác.</p>
      <div class="row">
        <button class="btn small" id="dlBackup" type="button">Tải file sao lưu</button>
        <label class="btn small filebtn">Mở file sao lưu<input type="file" id="fileIn" accept=".json,application/json"></label>
        <button class="btn small" id="dlCsv" type="button">Xuất nhật ký (CSV)</button>
      </div>
      <span class="note" id="msg" aria-live="polite"></span>
      <details><summary class="note" style="cursor:pointer">Cách cũ: sao chép, dán đoạn chữ</summary>
        <div class="stack" style="margin-top:10px">
          <div class="row"><button class="btn small" id="copyBtn" type="button">Sao chép dữ liệu</button><button class="btn small" id="importBtn" type="button">Nhập dữ liệu đã dán</button></div>
          <textarea id="dataBox" aria-label="Dữ liệu sao lưu" placeholder="Dán dữ liệu sao lưu vào đây rồi bấm Nhập"></textarea>
        </div>
      </details>
      <div class="row"><button class="btn small ghost" id="resetBtn" type="button">Xóa tiến độ và nhật ký của ${esc(p.name)}</button><span id="resetConfirm"></span></div>
    </div>
  </div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go({name:'parent',pid:b.dataset.pid}));
  document.getElementById('saveName').onclick=()=>{const v=document.getElementById('nameIn').value.trim();if(v){p.name=v;save();renderParent()}};
  app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>{sess=buildSession(p,b.dataset.practice);go({name:'session',pid:p.id})});
  const msg=document.getElementById('msg'),box=document.getElementById('dataBox');
  document.getElementById('copyBtn').onclick=()=>{const t=JSON.stringify(state);box.value=t;navigator.clipboard?.writeText(t).then(()=>msg.textContent='Đã sao chép.').catch(()=>{box.select();msg.textContent='Đã hiện dữ liệu ở ô bên dưới, bấm giữ để sao chép.'})||(box.select())};
  document.getElementById('dlBackup').onclick=async()=>{const events=await DB.all();const d=new Date();const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    await saveFile(`vo-on-toan-${stamp}.json`,JSON.stringify({app:'vo-on-toan',v:2,exported:d.toISOString(),state,events}),'application/json');msg.textContent=`Đã tạo file sao lưu (${events.length} dòng nhật ký).`};
  document.getElementById('dlCsv').onclick=async()=>{const evs=(await DB.all()).filter(e=>e.t==='answer');const names=Object.fromEntries(state.profiles.map(x=>[x.id,x.name]));const sk=Object.fromEntries([...SKILLS.g2,...SKILLS.g4].map(x=>[x.id,x.name]));
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const head=['Thời gian','Bé','Kỹ năng','Câu hỏi','Bé trả lời','Đáp án','Đúng','Số giây','Xem gợi ý','Làm lại'];
    const rows=evs.map(e=>[new Date(e.ts).toLocaleString('vi-VN'),names[e.pid]||e.pid,sk[e.skill]||e.skill,e.q,e.input,e.ans,e.ok?'Đúng':'Sai',e.secs,e.hint?'Có':'',e.retry?'Có':''].map(q).join(','));
    await saveFile('vo-on-toan-nhat-ky.csv','\ufeff'+[head.map(q).join(','),...rows].join('\r\n'),'text/csv');msg.textContent=`Đã xuất ${rows.length} câu trả lời.`};
  document.getElementById('fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());const st=o.state||o;if(!st.profiles)throw 0;state=st;save();if(Array.isArray(o.events))await DB.replaceAll(o.events);msg.textContent='Đã nhập dữ liệu từ file.';setTimeout(()=>renderParent(),600)}catch(err){msg.textContent='File không đúng định dạng sao lưu của Vở Ôn Toán.'}};
  fillLog(p);fillInstall();
  document.getElementById('importBtn').onclick=()=>{try{const s=JSON.parse(box.value);if(!s.profiles)throw 0;state=s;save();msg.textContent='Đã nhập dữ liệu.';setTimeout(()=>renderParent(),600)}catch(e){msg.textContent='Dữ liệu không đúng định dạng. Hãy dán nguyên đoạn đã sao chép.'}};
  document.getElementById('resetBtn').onclick=()=>{const rc=document.getElementById('resetConfirm');rc.innerHTML=`<button class="btn small" id="yesReset" type="button" style="border-color:var(--red);color:var(--red)">Chắc chắn xóa</button>`;document.getElementById('yesReset').onclick=()=>{Object.assign(p,{skills:{},streak:0,lastDay:null,stickers:[],sessions:0});save();DB.delPid(p.id).then(renderParent)}};
}

async function fillLog(p){
  const el=document.getElementById('logPanel');if(!el)return;
  const evs=await DB.byPid(p.id);if(view.name!=='parent'||view.pid!==p.id)return;
  const ans=evs.filter(e=>e.t==='answer');
  const sk=Object.fromEntries(skillsOf(p).map(x=>[x.id,x.name]));
  if(!ans.length){el.innerHTML='<h2>Nhật ký học</h2><p class="note" style="margin:0">Chưa có thao tác nào. Mỗi câu bé trả lời sẽ được ghi lại ở đây.</p>';return}
  const byDay={};for(const e of ans){const d=byDay[e.day]||(byDay[e.day]={n:0,ok:0,secs:0,hint:0});d.n++;if(e.ok)d.ok++;d.secs+=e.secs||0;if(e.hint)d.hint++}
  const days=Object.keys(byDay).map(Number).sort((a,b)=>b-a).slice(0,14);
  const dl=n=>{const d=new Date(n*86400000);return `${d.getUTCDate()}/${d.getUTCMonth()+1}`};
  const recent=ans.slice(-30).reverse();
  const tm=ts=>{const d=new Date(ts);return `${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  el.innerHTML=`<h2>Nhật ký học</h2>
    <p class="note" style="margin:0">Tổng cộng ${ans.length} câu đã làm, đúng ${Math.round(ans.filter(e=>e.ok).length/ans.length*100)}%.</p>
    <h3 style="font-size:17px">Theo ngày</h3>
    <div class="tablewrap"><table class="log" style="min-width:420px"><thead><tr><th>Ngày</th><th>Số câu</th><th>Đúng</th><th>Xem gợi ý</th><th>Thời gian làm</th></tr></thead><tbody>
    ${days.map(d=>{const x=byDay[d];return `<tr><td class="num">${dl(d)}</td><td class="num">${x.n}</td><td class="num">${x.ok} (${Math.round(x.ok/x.n*100)}%)</td><td class="num">${x.hint}</td><td class="num">${Math.max(1,Math.round(x.secs/60))} phút</td></tr>`}).join('')}
    </tbody></table></div>
    <h3 style="font-size:17px">30 câu gần nhất</h3>
    <div class="tablewrap"><table class="log"><thead><tr><th>Lúc</th><th>Kỹ năng</th><th>Câu hỏi</th><th>Bé trả lời</th><th>Đáp án</th><th>Giây</th></tr></thead><tbody>
    ${recent.map(e=>`<tr><td class="num">${tm(e.ts)}</td><td>${esc(sk[e.skill]||e.skill)}</td><td>${esc(e.q)}</td><td class="${e.ok?'ok':'no'}">${esc(e.input)} ${e.ok?'✓':'✗'}${e.hint?' <span class="chip amber" style="font-size:11px">gợi ý</span>':''}</td><td>${esc(e.ans)}</td><td class="num">${e.secs}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ================= tải file: chia sẻ trên điện thoại, tải xuống trên máy tính ================= */
async function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer:coarse)').matches){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ================= cài app & chạy offline ================= */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view.name==='parent')fillInstall()});
function fillInstall(){
  const el=document.getElementById('installPanel');if(!el)return;
  if(standalone()){el.innerHTML='<h2>Cài app vào máy</h2><p class="note" style="margin:0">Đang chạy như app đã cài. App dùng được cả khi không có mạng.</p>';return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  el.innerHTML=`<h2>Cài app vào máy</h2>
    <p class="note" style="margin:0">Cài lên màn hình chính để bé mở như một app bình thường, chạy được cả khi không có mạng.</p>
    ${installEvt?'<div><button class="btn primary small" id="installBtn" type="button">Cài app</button></div>':
      ios?'<p style="margin:0">Trên iPhone, iPad: mở bằng <b>Safari</b>, bấm nút <b>Chia sẻ</b> (ô vuông có mũi tên lên), chọn <b>Thêm vào MH chính</b>.</p>':
      '<p style="margin:0">Trên Android: mở bằng <b>Chrome</b>, bấm menu <b>⋮</b>, chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b>.</p>'}`;
  const b=document.getElementById('installBtn');if(b)b.onclick=async()=>{installEvt.prompt();await installEvt.userChoice;installEvt=null;fillInstall()};
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

render();
</script>
